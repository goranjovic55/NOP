# skill.yaml - Knowledge Skill Definition
apiVersion: akis/v1
kind: Skill
metadata:
  name: knowledge
  version: 2.0.0
  description: Project knowledge graph management, context caching, entity tracking
  author: AKIS
  tags: [knowledge, graph, context, caching]

spec:
  triggers:
    files:
      - "project_knowledge.json"
    keywords:
      - "knowledge"
      - "context"
      - "cache"
      - "entity"
    contexts:
      - "knowledge management"
      - "context caching"
      - "entity tracking"

  dependencies:
    required: []
    optional: []

  chains: []

  cache:
    preload: false
    priority: low
    ttl: permanent

  resources:
    tokens: 250
    patterns: 4
    examples: 2

  targets:
    detection_rate: 0.86
    false_positive_rate: 0.05
    pattern_reuse_rate: 0.40

gotchas:
  - id: invalid-json
    severity: error
    pattern: "project_knowledge.json"
    check: "json.loads"
    message: "Invalid JSON in knowledge file"
    fix: "Validate JSON syntax"

  - id: missing-version
    severity: warning
    pattern: "type"
    check: "version"
    message: "Missing version field"
    fix: "Add version field"

rules:
  - id: valid-json
    description: "Knowledge file must be valid JSON"
    enforce: true

  - id: hot-cache-first
    description: "Query hot cache before full search"
    enforce: true

patterns:
  - name: entity-template
    file: patterns/templates/entity_template.json.template
    description: "Entity definition"

  - name: relation-template
    file: patterns/templates/relation_template.json.template
    description: "Relation definition"

  - name: query-pattern
    file: patterns/templates/query_pattern.py.template
    description: "Graph query"

  - name: cache-update
    file: patterns/templates/cache_update.py.template
    description: "Cache management"
